<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOC | Admin Dashboard</title><link rel="stylesheet" href="admin.css"></head><body><header><h1>WOC Admin</h1><p>Election management</p></header><main><p id="status" role="status" aria-live="polite"></p><section class="panel" id="auth-panel"><h2>Administrator sign in</h2><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section><div id="dashboard" hidden><section class="panel"><div class="flex"><div><h2>Dashboard overview</h2><div class="count" id="count">Loading…</div></div><div><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="signout">Sign out</button></div></div></section><section class="panel"><h2>Add a Unix</h2><form id="single-form"><label for="single">Unix</label><input id="single" required pattern="[a-z0-9]{4,32}" placeholder="e.g. ejy2"><button>Add unix</button></form></section><section class="panel"><h2>Registered Unixes</h2><label for="unix-search">Search registered unixes</label><input id="unix-search" type="search" placeholder="Search unixes…"><p id="unix-list-status" role="status"></p><div class="tablewrap"><table><thead><tr><th>Unix</th><th>Action</th></tr></thead><tbody id="unix-list"></tbody></table></div></section><section class="panel"><h2>Board election settings</h2><form id="seats-form"><label for="seats">Available board seats (n)</label><input id="seats" type="number" min="1" max="100" step="1" required><button>Save seats</button></form><p class="hint">Voting rules will be configured later.</p></section><section class="panel"><h2>Manage Candidates</h2><p class="hint">Enter the profile prepared by the Selection Committee.</p><form id="candidate-form"><input id="candidate-id" type="hidden"><label for="candidate-name">Candidate full name</label><input id="candidate-name" maxlength="150" required><label for="candidate-profile">Selection Committee profile</label><textarea id="candidate-profile" maxlength="10000" rows="6" required></textarea><button id="candidate-save">Add candidate</button><button id="candidate-cancel" type="button" class="secondary" hidden>Cancel edit</button></form><div class="flex"><div><h3>Registered candidates</h3><p id="candidate-count" class="hint"></p></div><div><label for="candidate-order">Sort list</label><select id="candidate-order"><option value="manual">Manual order</option><option value="alphabetical">Alphabetical (view only)</option></select></div></div><label for="candidate-search">Search candidates</label><input id="candidate-search" type="search" placeholder="Search names or profiles"><div id="candidate-list" class="candidate-list"></div></section></div></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
