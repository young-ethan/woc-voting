<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOC | Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<header><strong>WOC</strong><span>Election administration</span><a href="index.html">Voter portal</a></header>
<main><p id="status" role="status" aria-live="polite"></p>
<section id="auth-panel" class="card"><h1>Administrator sign in</h1><p>Only approved WOC administrators can manage unixes.</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>
<div id="dashboard" hidden><div class="heading"><div><h1>Manage unixes</h1><p>Add and manage voter access codes.</p></div><button id="signout" class="secondary">Sign out</button></div>
<section class="card"><h2>Dashboard overview</h2><p id="count">Loading...</p><button id="refresh" class="secondary">Refresh</button></section>
<section class="card"><h2>Add a unix</h2><form id="single-form"><label for="single">Unix</label><input id="single" required pattern="[a-z0-9]{4,32}" placeholder="e.g. ejy2" autocomplete="off"><button>Add unix</button></form></section>
<section class="card"><h2>Registered Unixes</h2><p class="hint">Only approved administrators can see this list.</p><label for="unix-search">Search registered unixes</label><input id="unix-search" type="search" placeholder="Search unixes..."><p id="unix-list-status" role="status"></p><div class="tablewrap"><table><thead><tr><th>Unix</th><th>Action</th></tr></thead><tbody id="unix-list"></tbody></table></div></section></div></main>
<script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
